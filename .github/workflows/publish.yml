name: Publish

# Tags the commit, publishes to npm the version that the Prepare release workflow
# has set in core, dynamodb and cosmos, and creates the GitHub release. It skips
# what is done already, so it is safe to run again after a failure, and it never
# publishes anything twice. See .github/RELEASE.md.
#
# It has two jobs, so that the job that can publish runs no code from the
# packages' dependencies. build installs, builds, tests and packs the packages,
# but cannot publish. publish waits for approval, and then publishes what build
# packed, with nothing but npm, git and gh.

on:
  workflow_dispatch:

# one run at a time, and a run in progress is never cancelled
concurrency:
  group: publish
  cancel-in-progress: false

env:
  # in the order in which they are published, as the adapters need core
  PACKAGES: packages/core packages/dynamodb packages/cosmos

jobs:
  build:
    runs-on: ubuntu-latest
    # it runs the code of every dependency (yarn install, the build and the
    # tests), so it can only read the repository, and it cannot publish
    permissions:
      contents: read  # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}

    services:
      # for the tests of packages/cosmos, which wait for it to start
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:c274ac17c19a5f74dbadbc99f259bc49a8640a03f6789f54d7f76cbfc33ff6b6 # vnext-latest on 2026-11-25
        ports:
        - 8081:8081
      # for the tests of packages/postgres
      postgres:
        image: postgres@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e # 19 on 2026-11-26
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        # the steps start once it takes connections over TCP, as the tests do:
        # without -h, pg_isready passes already while the image sets up the
        # database, with a server that takes connections on a socket only. And
        # with -U, the server logs no error for each check
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - name: Check that this runs from main
      run: |
        if [ "$GITHUB_REF" != refs/heads/main ]; then
          echo "::error::Run Publish from main, not from $GITHUB_REF."
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.x'
        # and no cache, as npm advises for a build that is published

    - name: Checkout code
      # the commit of main that the run started on, also when the run is run
      # again: that is the commit that is published and tagged
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Check that Prepare release has run
      id: version
      run: |
        VERSION=$(node scripts/release.js version)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Install dependencies
      run: yarn install --frozen-lockfile

    - name: Build project
      run: yarn build

    - name: Run tests
      run: yarn test

    - name: Pack the packages
      # with --ignore-scripts, as npm pack would run the prepare script, which
      # builds again: so it packs what was built and tested above. npm names
      # each file after the package and its version, such as
      # es-aggregates-core-2.0.0.tgz
      run: |
        mkdir "$RUNNER_TEMP/packages"
        for FOLDER in $PACKAGES; do
          (cd "$FOLDER" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packages")
        done

    - name: Upload the packages
      # for publish, also when only publish is run again
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: packages
        path: ${{ runner.temp }}/packages
        if-no-files-found: error
        # longer than the 30 days in which publish can wait for approval, or
        # the run can be run again. A repository's settings can lower it
        retention-days: 90

  publish:
    # so that it waits for approval only once the tests have passed
    needs: build
    runs-on: ubuntu-latest
    # which waits for approval, and which only main may use. The trusted
    # publishers on npm name it, and this file
    environment: npm
    # any program that runs in this job could publish to npm under our names, so
    # it installs nothing, builds nothing and runs no tests
    permissions:
      contents: write  # push the tag, and create the GitHub release
      id-token: write  # publish to npm with trusted publishing (OIDC)
    env:
      # that build checked
      VERSION: ${{ needs.build.outputs.version }}

    steps:
    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: Check npm
      # trusted publishing needs npm 11.5.1 or later
      run: |
        NPM_VERSION=$(npm --version)
        if [ "$(printf '%s\n' 11.5.1 "$NPM_VERSION" | sort -V | head -n 1)" != 11.5.1 ]; then
          echo "::error::Trusted publishing needs npm 11.5.1 or later, and this is npm $NPM_VERSION."
          exit 1
        fi

    - name: Checkout code
      # the commit that build built and tested, also when the run is run again.
      # For scripts/release.js, which uses no package, and for the tag
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download the packages
      # that build packed
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: packages
        path: ${{ runner.temp }}/packages

    - name: Check the packages
      # that the file of each package holds that package, at that version,
      # before any of them is published
      run: |
        for FOLDER in $PACKAGES; do
          NAME=$(node -p "require('./$FOLDER/package.json').name")
          FILE=$RUNNER_TEMP/packages/$(echo "${NAME#@}" | tr / -)-$VERSION.tgz
          if [ ! -f "$FILE" ]; then
            echo "::error::build packed no $FILE."
            exit 1
          fi
          # the package.json in the file, which is what npm publish reads
          FOUND=$(tar -xzOf "$FILE" package/package.json | node -p 'const json = JSON.parse(require("fs").readFileSync(0, "utf8")); json.name + "@" + json.version')
          if [ "$FOUND" != "$NAME@$VERSION" ]; then
            echo "::error::$FILE holds $FOUND, and not $NAME@$VERSION."
            exit 1
          fi
          echo "$FILE holds $NAME@$VERSION"
        done

    - name: Tag the commit that is about to be published
      # before Publish to npm, so that the three packages of a version are all
      # published from the same commit: a run on another commit stops here,
      # before it publishes anything
      env:
        TAG: v${{ needs.build.outputs.version }}
      run: |
        COMMIT=$(git rev-parse HEAD)
        # the commit of the tag on GitHub, if it is there: that of an annotated
        # tag is on the line of TAG^{}, which comes last
        REFS=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
        TAGGED=$(echo "$REFS" | tail -n 1 | cut -f 1)
        if [ -z "$TAGGED" ]; then
          git push origin "$COMMIT:refs/tags/$TAG"
        elif [ "$TAGGED" != "$COMMIT" ]; then
          echo "::error::$TAG is on $TAGGED, and not on $COMMIT, which this run checked out. If an earlier run of Publish tagged $TAGGED, re-run that run instead; if none of the three packages is on npm at $VERSION yet, you can delete $TAG on GitHub, and run Publish again."
          exit 1
        else
          echo "$TAG is on $COMMIT already"
        fi

    - name: Publish to npm
      # each package that is not on npm yet, from the file that build packed.
      # npm takes the name, the version and the rest of package.json from the
      # file, and runs no script for a file. It runs in the folder of the files,
      # outside the repository, so that no .npmrc or package.json of the
      # repository changes what it does
      run: |
        for FOLDER in $PACKAGES; do
          NAME=$(node -p "require('./$FOLDER/package.json').name")
          FILE=$(echo "${NAME#@}" | tr / -)-$VERSION.tgz
          # yes or no, and it fails if npm answers anything but the version or 404
          ON_NPM=$(node scripts/release.js on-npm "$NAME" "$VERSION")
          if [ "$ON_NPM" = yes ]; then
            echo "$NAME@$VERSION is on npm already"
          else
            (cd "$RUNNER_TEMP/packages" && npm publish "./$FILE" --access public --provenance)
          fi
        done

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view "v$VERSION" > /dev/null; then
          echo "The release v$VERSION is on GitHub already"
          exit 0
        fi
        for FOLDER in $PACKAGES; do
          NAME=$(node -p "require('./$FOLDER/package.json').name")
          echo "- [$NAME $VERSION](https://www.npmjs.com/package/$NAME/v/$VERSION)"
        done > "$RUNNER_TEMP/notes.md"
        gh release create "v$VERSION" --verify-tag --title "Release v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
