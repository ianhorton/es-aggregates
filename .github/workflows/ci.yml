name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Lets the Prepare release workflow trigger these checks on its release branch
  # via `gh workflow run` (GITHUB_TOKEN can dispatch — workflow_dispatch is the
  # documented exception to the no-recursion rule), so the release PR opened by
  # the bot still gets its required checks. See prepare-release.yml.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    services:
      # for the tests of packages/cosmos, which wait for it to start
      cosmos:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:c274ac17c19a5f74dbadbc99f259bc49a8640a03f6789f54d7f76cbfc33ff6b6 # vnext-latest on 2026-11-25
        ports:
        - 8081:8081
      # for the tests of packages/postgres
      postgres:
        image: postgres@sha256:4ea94de574c17f0372722806c949757050fbb1cd7648410fe45d6bba275cc00e # 19 on 2026-11-26
        ports:
        - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
        # the steps start once it takes connections over TCP, as the tests do:
        # without -h, pg_isready passes already while the image sets up the
        # database, with a server that takes connections on a socket only. And
        # with -U, the server logs no error for each check
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
        
    - name: Install dependencies
      run: yarn install --frozen-lockfile
      
    - name: Run tests
      run: yarn test
      
    - name: Build project
      run: yarn build
      
    - name: Check for uncommitted changes
      run: |
        if [[ -n $(git status --porcelain) ]]; then
          echo "Uncommitted changes detected after build:"
          git status --porcelain
          exit 1
        fi